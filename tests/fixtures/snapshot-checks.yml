name: Validación de snapshot revisado
steps:
      - name: Decisiones de jq con el jq que fijan las recetas
        env:
          JQ_VERSION: jq-1.8.2
          JQ_SHA256: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/jq-fijado"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/jq" "https://github.com/jqlang/jq/releases/download/${JQ_VERSION}/jq-linux-amd64"
          echo "${JQ_SHA256}  $dir/jq" | sha256sum -c -
          chmod +x "$dir/jq"
          export PATH="$dir:$PATH"
          [ "$(jq --version)" = "$JQ_VERSION" ] || { echo "::error::jq en PATH no es $JQ_VERSION"; exit 1; }
          bash tests/expect-audit-decision.sh

