name: verify-node (reusable)

# Receta de verificación reutilizable para proyectos Node/TS de la flota Watson.
# Solo la capa STACK-AGNÓSTICA de seguridad (secrets + SAST + npm audit).
#
# Uso desde un repo (v2 — BREAKING vs v1: sin input `blocking`):
#   on:
#     pull_request:
#     push: { branches: [main] }
#   jobs:
#     verify:
#       uses: dwadrian/watson-ci/.github/workflows/verify-node.yml@v2
#
# MODELO v2: secrets siempre bloquea · SAST bloquea lo NUEVO vs baseline · npm audit siempre
# bloquea high/critical.

on:
  workflow_call:
    inputs:
      gated-branches:
        description: 'Patrones extra de ramas gateadas (espacio-separados, glob). Default siempre: main master *_prod'
        type: string
        default: ''
      strict-on-gated:
        description: 'false = NUNCA full-estricto en rama gateada (siempre diff-aware). Para security-tools cuyo código inseguro es by-design (mcp) o repos EOL. Default true.'
        type: boolean
        default: true
      node-version:
        description: 'Versión de Node'
        type: string
        default: '20'
      test-command:
        description: 'Comando de test opcional (vacío = no corre tests aquí)'
        type: string
        default: ''
      tooling-ref:
        description: >-
          Ref de watson-ci de donde se toma el tooling pineado (requirements con hash y
          alcance.sh). Default 'v2'. NO se puede derivar en runtime: medido 2026-08-05 desde
          un repo externo, `github.job_workflow_ref` llega VACIO (es un claim de OIDC, no una
          expresion) y `github.workflow_ref` apunta al CALLER. Por eso es explicito. Un caller
          que consuma la receta por otro alias debe pasar el suyo.
        type: string
        default: 'v2'

concurrency:
  group: verify-node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 🔒 secrets + SAST + deps (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # persist-credentials: false — el GITHUB_TOKEN quedaba escrito en .git/config del
          # workspace, en el MISMO job donde corre el `pip install` de tooling cuyas deps
          # transitivas no estan pineadas por hash. Nada aqui usa el token para git: solo
          # merge-base, cat-file y --baseline-commit, todo local.
          persist-credentials: false
          fetch-depth: 0        # historia completa: semgrep --baseline-commit necesita el diff
          filter: blob:none     # grafo de commits para merge-base; blobs on-demand (barato en repos grandes)

      - name: Setup Python (para Semgrep)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # ── El tooling pineado vive en watson-ci, NO en el repo que llama ────────────────
      # Un workflow reutilizable ejecuta sus `run:` sobre el checkout del CALLER, asi que
      # `tools/requirements-*.txt` solo resolvia dentro de watson-ci y reventaba en los 17
      # repos con "No such file or directory", matando el job antes de escanear NADA. El
      # canario `selftest.yml` es ciego a esta clase: corre DENTRO de watson-ci.
      #
      # La ref va como INPUT explicito, no derivada: medido desde un repo externo,
      # `github.job_workflow_ref` llega VACIO y `github.workflow_ref` apunta al caller.
      # No hay forma de que la receta sepa su propia ref.
      - name: Checkout del tooling de la receta
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: dwadrian/watson-ci
          ref: ${{ inputs.tooling-ref }}
          path: .watson-ci-tooling
          persist-credentials: false

      - name: Instalar Semgrep (versión pineada)
        # --require-hashes: TODAS las deps transitivas pineadas por hash (tools/requirements-semgrep.txt).
        # Antes solo el binario estaba pineado y sus ~30 deps se resolvian en cada corrida; una
        # sola comprometida ejecuta codigo en el job, con el fuente privado del caller ya en
        # disco. --no-deps porque el archivo ya trae el cierre transitivo completo.
        run: pip install --require-hashes --no-deps -r .watson-ci-tooling/tools/requirements-semgrep.txt

      # Visibilidad del alcance real del scan (v3, 2026-08-03).
      #
      # `semgrep scan .` honra el `.semgrepignore` del repo ESCANEADO. Eso es correcto por
      # diseño —un repo debe poder excluir vendor/ o dumps— pero significa que **el alcance del
      # gate lo controla el repo auditado**, y un PR puede ampliar ese archivo y quedar cubierto
      # por ese mismo PR. En la flota ya hay dos, ambos justificados, pero uno excluye `.claude/`
      # y `.githooks/`: justo donde vive código ejecutable.
      #
      # No se bloquea: prohibirlo rompería exclusiones legítimas. Se hace VISIBLE, que es lo que
      # faltaba — hoy nadie puede saber, leyendo un run verde, cuántos archivos se escanearon.
      - name: 👁️ Alcance del scan (.semgrepignore efectivo)
        run: |
          set -uo pipefail
          if [ -f .semgrepignore ]; then
            echo "::warning::Este repo tiene .semgrepignore — el alcance del gate esta acotado por el repo auditado."
            echo "── .semgrepignore ──"; cat .semgrepignore
          else
            echo "sin .semgrepignore (se usan las exclusiones por defecto de semgrep)"
          fi
          TRACKED=$(git ls-files | wc -l | tr -d ' ')
          echo "archivos rastreados por git: $TRACKED"
          echo "  (si el numero escaneado por semgrep es mucho menor, el ignore esta comiendose el gate)"

      # La lógica NO se duplica aquí: se ejecuta `alcance.sh` del checkout del tooling, el
      # MISMO archivo que consume la composite action `.github/actions/alcance` para los
      # workflows locales de cada repo. Una implementación, dos modos de consumo — si viviera
      # inline, la copia de la receta y la de los repos divergirían en el primer arreglo.
      - name: "📐 Alcance del push (¿solo documentacion?)"
        id: alcance
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .watson-ci-tooling/.github/actions/alcance/alcance.sh

      # El checkout del tooling se borra ANTES de escanear: si no, semgrep analizaría el
      # código de la receta como si fuera del repo auditado.
      - name: Limpiar el checkout del tooling
        run: rm -rf .watson-ci-tooling

      - name: 🔑 Secrets scan (bloquea siempre)
        run: semgrep scan --config "p/secrets" --error --quiet --disable-version-check --metrics=off --timeout 120 .

      - name: 🛡️ SAST high/critical (diff-aware)
        if: steps.alcance.outputs.solo_docs != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          GATED_EXTRA: ${{ inputs.gated-branches }}
          GATED_STRICT: ${{ inputs.strict-on-gated }}
        run: |
          set -uo pipefail   # OJO: el shell de Actions ya trae -e; el advisory usa `if` para no abortar.
          CONFIGS='--config p/security-audit --config p/javascript --config p/typescript'
          COMMON='--severity ERROR --quiet --disable-version-check --metrics=off --timeout 120'

          # --- branch-aware (v2.2): push/PR hacia rama GATEADA => full-estricto sin baseline.
          # "El costo donde el riesgo": la deuda vieja TAMBIEN bloquea camino a prod.
          TARGET_BRANCH="$BASE_REF"; [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="$REF_NAME"
          GATED=false
          set -f  # sin pathname-expansion: un archivo app_prod en el repo NO debe comerse el patrón *_prod (sec LOW 2026-07-18)
          for pat in main master *_prod $GATED_EXTRA; do
            # shellcheck disable=SC2254
            case "$TARGET_BRANCH" in $pat) GATED=true ;; esac
          done
          set +f
          if [ "$GATED" = true ] && [ "$GATED_STRICT" != "false" ]; then
            echo "rama gateada ($TARGET_BRANCH): SAST FULL-ESTRICTO (sin baseline — deuda tambien bloquea)."
            semgrep scan $CONFIGS $COMMON --error .
            exit 0
          fi
          [ "$GATED" = true ] && echo "rama gateada pero strict-on-gated=false (opt-out: security-tool/EOL) — sigue diff-aware."


          BASELINE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASELINE=$(git merge-base "$BASE_SHA" HEAD 2>/dev/null || true)
          elif [ "$EVENT_NAME" = "push" ]; then
            case "$BEFORE_SHA" in
              *[!0]*) git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null && BASELINE="$BEFORE_SHA" || true ;;
            esac
          fi

          if [ -n "$BASELINE" ]; then
            echo "diff-aware: bloqueando hallazgos ERROR NUEVOS vs $BASELINE"
            semgrep scan $CONFIGS $COMMON --baseline-commit "$BASELINE" --error .
          else
            echo "::warning::sin baseline (primer push / force-push / historia no relacionada) — full scan ADVISORY."
            if semgrep scan $CONFIGS $COMMON --error .; then rc=0; else rc=$?; fi
            if   [ "$rc" -eq 0 ]; then echo "✅ sin hallazgos ERROR."
            elif [ "$rc" -eq 1 ]; then echo "::warning::hallazgos ERROR (advisory: sin baseline no separamos nuevo de deuda)."
            else echo "::error::semgrep falló (rc=$rc) — fail-closed."; exit 1
            fi
          fi

      - name: 🟡 SAST medio/bajo (advisory)
        if: always() && steps.alcance.outputs.solo_docs != 'true'
        run: semgrep scan --config "p/security-audit" --config "p/javascript" --config "p/typescript" --severity WARNING --quiet --disable-version-check --metrics=off --timeout 120 . || true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      # --ignore-scripts: NO ejecutar lifecycle scripts de deps. El audit lee el lockfile.
      # npm audit sale != 0 ante high/critical O ante error de red => bloquea (fail-closed).
      - name: 📦 npm audit (bloquea high/critical SIEMPRE)
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then echo "sin package.json — skip npm audit"; exit 0; fi
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo "sin lockfile — npm install (reproducibilidad reducida)"
            npm install --ignore-scripts --no-audit --no-fund
          fi
          npm audit --audit-level=high

      - name: 🧪 Tests (opcional, solo si se pasa test-command)
        if: ${{ inputs.test-command != '' && steps.alcance.outputs.solo_docs != 'true' }}
        env:
          TEST_CMD: ${{ inputs.test-command }}
        run: bash -c "$TEST_CMD"

      - name: 📋 Summary
        if: always()
        run: |
          echo "verify-node@v2 — secrets(siempre) + SAST(diff-aware) + npm audit(siempre high/crit)." >> "$GITHUB_STEP_SUMMARY"
