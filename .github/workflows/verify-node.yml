name: verify-node (reusable)

# Receta de verificación reutilizable para proyectos Node/TS de la flota Watson.
# Solo la capa STACK-AGNÓSTICA de seguridad (secrets + SAST + npm audit).
#
# Uso desde un repo (v2 — BREAKING vs v1: sin input `blocking`):
#   on:
#     pull_request:
#     push: { branches: [main] }
#   jobs:
#     verify:
#       uses: dwadrian/watson-ci/.github/workflows/verify-node.yml@v2
#
# MODELO v2: secrets siempre bloquea · SAST bloquea lo NUEVO vs baseline · npm audit siempre
# bloquea high/critical.

on:
  workflow_call:
    inputs:
      gated-branches:
        description: 'Patrones extra de ramas gateadas (espacio-separados, glob). Default siempre: main master *_prod'
        type: string
        default: ''
      node-version:
        description: 'Versión de Node'
        type: string
        default: '20'
      test-command:
        description: 'Comando de test opcional (vacío = no corre tests aquí)'
        type: string
        default: ''

concurrency:
  group: verify-node-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 🔒 secrets + SAST + deps (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0        # historia completa: semgrep --baseline-commit necesita el diff
          filter: blob:none     # grafo de commits para merge-base; blobs on-demand (barato en repos grandes)

      - name: Setup Python (para Semgrep)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Instalar Semgrep (versión pineada)
        run: pip install semgrep==1.157.0

      - name: 🔑 Secrets scan (bloquea siempre)
        run: semgrep scan --config "p/secrets" --error --quiet --disable-version-check --timeout 120 .

      - name: 🛡️ SAST high/critical (diff-aware)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          GATED_EXTRA: ${{ inputs.gated-branches }}
        run: |
          set -uo pipefail   # OJO: el shell de Actions ya trae -e; el advisory usa `if` para no abortar.
          CONFIGS='--config p/security-audit --config p/javascript --config p/typescript'
          COMMON='--severity ERROR --quiet --disable-version-check --timeout 120'

          # --- branch-aware (v2.2): push/PR hacia rama GATEADA => full-estricto sin baseline.
          # "El costo donde el riesgo": la deuda vieja TAMBIEN bloquea camino a prod.
          TARGET_BRANCH="$BASE_REF"; [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="$REF_NAME"
          GATED=false
          set -f  # sin pathname-expansion: un archivo app_prod en el repo NO debe comerse el patrón *_prod (sec LOW 2026-07-18)
          for pat in main master *_prod $GATED_EXTRA; do
            # shellcheck disable=SC2254
            case "$TARGET_BRANCH" in $pat) GATED=true ;; esac
          done
          set +f
          if [ "$GATED" = true ]; then
            echo "rama gateada ($TARGET_BRANCH): SAST FULL-ESTRICTO (sin baseline — deuda tambien bloquea)."
            semgrep scan $CONFIGS $COMMON --error .
            exit 0
          fi

          BASELINE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASELINE=$(git merge-base "$BASE_SHA" HEAD 2>/dev/null || true)
          elif [ "$EVENT_NAME" = "push" ]; then
            case "$BEFORE_SHA" in
              *[!0]*) git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null && BASELINE="$BEFORE_SHA" || true ;;
            esac
          fi

          if [ -n "$BASELINE" ]; then
            echo "diff-aware: bloqueando hallazgos ERROR NUEVOS vs $BASELINE"
            semgrep scan $CONFIGS $COMMON --baseline-commit "$BASELINE" --error .
          else
            echo "::warning::sin baseline (primer push / force-push / historia no relacionada) — full scan ADVISORY."
            if semgrep scan $CONFIGS $COMMON --error .; then rc=0; else rc=$?; fi
            if   [ "$rc" -eq 0 ]; then echo "✅ sin hallazgos ERROR."
            elif [ "$rc" -eq 1 ]; then echo "::warning::hallazgos ERROR (advisory: sin baseline no separamos nuevo de deuda)."
            else echo "::error::semgrep falló (rc=$rc) — fail-closed."; exit 1
            fi
          fi

      - name: 🟡 SAST medio/bajo (advisory)
        if: always()
        run: semgrep scan --config "p/security-audit" --config "p/javascript" --config "p/typescript" --severity WARNING --quiet --disable-version-check --timeout 120 . || true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      # --ignore-scripts: NO ejecutar lifecycle scripts de deps. El audit lee el lockfile.
      # npm audit sale != 0 ante high/critical O ante error de red => bloquea (fail-closed).
      - name: 📦 npm audit (bloquea high/critical SIEMPRE)
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then echo "sin package.json — skip npm audit"; exit 0; fi
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo "sin lockfile — npm install (reproducibilidad reducida)"
            npm install --ignore-scripts --no-audit --no-fund
          fi
          npm audit --audit-level=high

      - name: 🧪 Tests (opcional, solo si se pasa test-command)
        if: ${{ inputs.test-command != '' }}
        env:
          TEST_CMD: ${{ inputs.test-command }}
        run: bash -c "$TEST_CMD"

      - name: 📋 Summary
        if: always()
        run: |
          echo "verify-node@v2 — secrets(siempre) + SAST(diff-aware) + npm audit(siempre high/crit)." >> "$GITHUB_STEP_SUMMARY"
