name: verify-python (reusable)

# Receta de verificación reutilizable para proyectos Python de la flota Watson.
# Solo la capa STACK-AGNÓSTICA de seguridad (secrets + SAST + dep audit).
#
# Uso desde un repo (v2 — BREAKING vs v1: sin input `blocking`):
#   on:
#     pull_request:
#     push: { branches: [main] }
#   jobs:
#     verify:
#       uses: dwadrian/watson-ci/.github/workflows/verify-python.yml@v2
# NO pasar `secrets: inherit`.
#
# MODELO v2:
#   - secrets: SIEMPRE bloquea.
#   - SAST ERROR: bloquea hallazgos NUEVOS vs baseline (diff-aware); sin baseline => advisory.
#   - deps (pip-audit): SIEMPRE bloquea. DIVERGENCIA DELIBERADA: pip-audit NO expone severidad
#     (pypa/pip-audit#654), así que "bloquea high/critical" colapsa honestamente a "bloquea
#     CUALQUIER vuln conocida". Es la única semántica fiel a la herramienta oficial.

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Versión de Python (pip-audit requiere >=3.10)'
        type: string
        default: '3.12'

concurrency:
  group: verify-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 🔒 secrets + SAST + deps (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0        # historia completa: semgrep --baseline-commit necesita el diff
          filter: blob:none     # grafo de commits para merge-base; blobs on-demand (barato en repos grandes)

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}

      # pipx = cada CLI en su venv aislado (semgrep y pip-audit tienen deps transitivas en
      # conflicto y NO conviven en un mismo pip install => ResolutionImpossible).
      - name: Instalar herramientas (versiones pineadas, aisladas)
        run: |
          pipx install semgrep==1.157.0
          pipx install pip-audit==2.10.1

      - name: 🔑 Secrets scan (bloquea siempre)
        run: semgrep scan --config "p/secrets" --error --quiet --disable-version-check --timeout 120 .

      - name: 🛡️ SAST high/critical (diff-aware)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail   # OJO: el shell de Actions ya trae -e; el advisory usa `if` para no abortar.
          CONFIGS='--config p/security-audit --config p/python'
          COMMON='--severity ERROR --quiet --disable-version-check --timeout 120'

          BASELINE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASELINE=$(git merge-base "$BASE_SHA" HEAD 2>/dev/null || true)
          elif [ "$EVENT_NAME" = "push" ]; then
            case "$BEFORE_SHA" in
              *[!0]*) git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null && BASELINE="$BEFORE_SHA" || true ;;
            esac
          fi

          if [ -n "$BASELINE" ]; then
            echo "diff-aware: bloqueando hallazgos ERROR NUEVOS vs $BASELINE"
            semgrep scan $CONFIGS $COMMON --baseline-commit "$BASELINE" --error .
          else
            echo "::warning::sin baseline (primer push / force-push / historia no relacionada) — full scan ADVISORY."
            if semgrep scan $CONFIGS $COMMON --error .; then rc=0; else rc=$?; fi
            if   [ "$rc" -eq 0 ]; then echo "✅ sin hallazgos ERROR."
            elif [ "$rc" -eq 1 ]; then echo "::warning::hallazgos ERROR (advisory: sin baseline no separamos nuevo de deuda)."
            else echo "::error::semgrep falló (rc=$rc) — fail-closed."; exit 1
            fi
          fi

      - name: 🟡 SAST medio/bajo (advisory)
        if: always()
        run: semgrep scan --config "p/security-audit" --config "p/python" --severity WARNING --quiet --disable-version-check --timeout 120 . || true

      # Dep-audit con pip-audit (PyPA oficial). Gate por JSON. --no-deps/--locked auditan SIN
      # instalar (no se ejecuta setup.py de ninguna dep). Solo fuentes TOTALMENTE PINEADAS.
      - name: 📦 pip-audit (bloquea CUALQUIER vuln SIEMPRE)
        run: |
          set -uo pipefail

          reqfiles=()
          while IFS= read -r f; do reqfiles+=("$f"); done < <(find . -maxdepth 2 -name 'requirements*.txt' -not -path '*/.git/*' | sort)
          has_pylock=false; [ -f pylock.toml ] && has_pylock=true
          has_pyproject=false; [ -f pyproject.toml ] && has_pyproject=true

          if [ "${#reqfiles[@]}" -eq 0 ] && [ "$has_pylock" = "false" ]; then
            if [ "$has_pyproject" = "true" ]; then
              echo "::warning::Hay pyproject.toml pero ningún lockfile pineado (requirements*.txt / pylock.toml)."
              echo "::warning::Auditar pyproject requeriría CONSTRUIR el proyecto — se omite por seguridad."
              echo "::warning::Genera un lockfile: 'pip lock' (PEP 751 -> pylock.toml) o pip-compile -> requirements.txt."
              exit 0
            fi
            echo "sin manifiesto Python (requirements*.txt / pylock.toml / pyproject.toml) — skip pip-audit."
            exit 0
          fi

          # Fail-closed sobre UNA fuente. JSON inválido/ausente = tool falló => RED.
          audit_source() {
            local label="$1"; shift
            local out="/tmp/pipaudit_$$.json"
            echo "── auditando: $label"
            timeout 300 pip-audit "$@" --format=json > "$out" 2>/tmp/pipaudit_err_$$.txt
            local rc=$?
            if ! jq -e . "$out" >/dev/null 2>&1; then
              echo "::error::pip-audit no produjo JSON válido para '$label' (rc=$rc) — tool/red falló o deps sin pinear."
              cat /tmp/pipaudit_err_$$.txt || true
              return 1
            fi
            local vulns
            vulns=$(jq '[.. | objects | select(has("vulns")) | .vulns[]?] | length' "$out")
            echo "vulns conocidas en '$label': $vulns"
            jq '[.. | objects | select(has("vulns")) | select((.vulns|length)>0) | {name, version, ids: [.vulns[].id]}]' "$out"
            if [ "$vulns" -gt 0 ]; then
              echo "::error::'$label' tiene $vulns vuln(s) — bloqueado (supply chain no es opcional; pip-audit no da severidad, ver #654)."
              return 1
            fi
            return 0
          }

          # --strict: enforce nativo de "totalmente pineadas" (una entrada URL/VCS/editable sin
          # pinear => error fatal, no skip silencioso => cierra el silent-coverage-gap).
          rc_total=0
          if [ "$has_pylock" = "true" ]; then
            audit_source "pylock.toml" --locked --strict || rc_total=1
          fi
          for f in "${reqfiles[@]}"; do
            audit_source "$f" --no-deps --strict -r "$f" || rc_total=1
          done

          if [ "$rc_total" -ne 0 ]; then
            echo "::error::pip-audit falló (ver arriba)."
            exit 1
          fi
          echo "✅ pip-audit OK."

      - name: 📋 Summary
        if: always()
        run: |
          echo "verify-python@v2 — secrets(siempre) + SAST(diff-aware) + pip-audit(siempre, cualquier vuln — sin severidad, #654)." >> "$GITHUB_STEP_SUMMARY"
