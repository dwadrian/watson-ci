name: verify-python (reusable)

# Receta de verificación reutilizable para proyectos Python de la flota Watson.
# Solo la capa STACK-AGNÓSTICA de seguridad (secrets + SAST + dep audit).
#
# Uso desde un repo (v2 — BREAKING vs v1: sin input `blocking`):
#   on:
#     pull_request:
#     push: { branches: [main] }
#   jobs:
#     verify:
#       uses: dwadrian/watson-ci/.github/workflows/verify-python.yml@v2
# NO pasar `secrets: inherit`.
#
# MODELO v2:
#   - secrets: SIEMPRE bloquea.
#   - SAST ERROR: bloquea hallazgos NUEVOS vs baseline (diff-aware); sin baseline => advisory.
#   - deps (pip-audit): SIEMPRE bloquea. DIVERGENCIA DELIBERADA: pip-audit NO expone severidad
#     (pypa/pip-audit#654), así que "bloquea high/critical" colapsa honestamente a "bloquea
#     CUALQUIER vuln conocida". Es la única semántica fiel a la herramienta oficial.

on:
  workflow_call:
    inputs:
      gated-branches:
        description: 'Patrones extra de ramas gateadas (espacio-separados, glob). Default siempre: main master *_prod'
        type: string
        default: ''
      strict-on-gated:
        description: 'false = NUNCA full-estricto en rama gateada (siempre diff-aware). Para security-tools cuyo código inseguro es by-design (mcp) o repos EOL. Default true.'
        type: boolean
        default: true
      python-version:
        description: 'Versión de Python (pip-audit requiere >=3.10)'
        type: string
        default: '3.12'
      python-audit-optional:
        description: 'true = un proyecto SIN lockfile auditable pasa con WARN en vez de ROJO. Solo para repos donde las deps se gestionan fuera del repo. Default false.'
        type: boolean
        default: false
      pip-audit-ignore-vuln:
        description: 'IDs de vulnerabilidad (coma-separados) exentos, declarados UNO A UNO. Para deps pineadas exacto por una herramienta upstream que aun no las corrige. NO es un interruptor global.'
        type: string
        default: ''

concurrency:
  group: verify-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 🔒 secrets + SAST + deps (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # persist-credentials: false — el GITHUB_TOKEN quedaba escrito en .git/config del
          # workspace, en el MISMO job donde corre el `pip install` de tooling cuyas deps
          # transitivas no estan pineadas por hash. Nada aqui usa el token para git: solo
          # merge-base, cat-file y --baseline-commit, todo local.
          persist-credentials: false
          fetch-depth: 0        # historia completa: semgrep --baseline-commit necesita el diff
          filter: blob:none     # grafo de commits para merge-base; blobs on-demand (barato en repos grandes)

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}

      # DOS VENVS EXPLICITOS, no pipx (v3, 2026-08-03).
      #
      # El aislamiento sigue siendo obligatorio: semgrep y pip-audit tienen deps transitivas en
      # CONFLICTO y no conviven en un mismo `pip install` (ResolutionImpossible, cazado por el
      # piloto de makro). Antes se lograba con pipx.
      #
      # Se cambia a venvs porque `--require-hashes` necesita instalar DESDE un requirements con
      # el cierre transitivo completo (`-r tools/*.txt`), y mezclar eso con `pipx install
      # <paquete>` es ambiguo: pipx quiere instalar el paquete nombrado, el archivo ya lo trae.
      # La forma con venv + pip se verifico localmente (`pip install --require-hashes --no-deps
      # -r` resuelve las 28/66 deps del archivo); la de pipx no se pudo verificar, y publicar
      # una forma sin verificar en el repo del que dependen 16 repos no es aceptable.
      # ── El tooling pineado vive en watson-ci, NO en el repo que llama ────────────────
      # Un workflow reutilizable ejecuta sus `run:` sobre el checkout del CALLER. Referir
      # `tools/requirements-*.txt` con ruta relativa funcionaba solo dentro de watson-ci y
      # reventaba en los 17 repos con "No such file or directory", matando el job en el paso 4:
      # ni secretos, ni SAST, ni dep-audit, ni tests. El canario `selftest.yml` no puede cazar
      # esta clase: corre DENTRO de watson-ci, donde la ruta si resuelve.
      #
      # Se ancla a la MISMA ref con la que se invoco la receta (`job_workflow_ref`), no a `main`:
      # si un repo pide @v2, su tooling es el de @v2. Fail-closed si no se puede determinar.
      - name: "📌 Anclar la version de la receta"
        id: receta
        env:
          JOB_REF: ${{ github.job_workflow_ref }}
        run: |
          set -uo pipefail
          # formato: owner/repo/.github/workflows/x.yml@refs/tags/v2
          REF="${JOB_REF##*@}"
          if [ -z "$REF" ] || [ "$REF" = "$JOB_REF" ]; then
            echo "::error::No se pudo determinar la ref de la receta (job_workflow_ref='$JOB_REF')."
            echo "::error::Sin tooling pineado no se continua: un scanner sin version fija no es un gate."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "receta anclada a: $REF"

      - name: Checkout del tooling de la receta
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: dwadrian/watson-ci
          ref: ${{ steps.receta.outputs.ref }}
          path: .watson-ci-tooling
          persist-credentials: false

      - name: Instalar herramientas (pineadas por hash, aisladas)
        run: |
          set -euo pipefail
          python -m venv /tmp/venv-semgrep
          /tmp/venv-semgrep/bin/pip install --quiet --require-hashes --no-deps -r .watson-ci-tooling/tools/requirements-semgrep.txt
          python -m venv /tmp/venv-pipaudit
          /tmp/venv-pipaudit/bin/pip install --quiet --require-hashes --no-deps -r .watson-ci-tooling/tools/requirements-pip-audit.txt
          # Al PATH para que los pasos siguientes invoquen `semgrep` y `pip-audit` sin cambios.
          echo "/tmp/venv-semgrep/bin" >> "$GITHUB_PATH"
          echo "/tmp/venv-pipaudit/bin" >> "$GITHUB_PATH"
          /tmp/venv-semgrep/bin/semgrep --version
          /tmp/venv-pipaudit/bin/pip-audit --version

      # Visibilidad del alcance real del scan (v3, 2026-08-03).
      #
      # `semgrep scan .` honra el `.semgrepignore` del repo ESCANEADO. Eso es correcto por
      # diseño —un repo debe poder excluir vendor/ o dumps— pero significa que **el alcance del
      # gate lo controla el repo auditado**, y un PR puede ampliar ese archivo y quedar cubierto
      # por ese mismo PR. En la flota ya hay dos, ambos justificados, pero uno excluye `.claude/`
      # y `.githooks/`: justo donde vive código ejecutable.
      #
      # No se bloquea: prohibirlo rompería exclusiones legítimas. Se hace VISIBLE, que es lo que
      # faltaba — hoy nadie puede saber, leyendo un run verde, cuántos archivos se escanearon.
      - name: 👁️ Alcance del scan (.semgrepignore efectivo)
        run: |
          set -uo pipefail
          if [ -f .semgrepignore ]; then
            echo "::warning::Este repo tiene .semgrepignore — el alcance del gate esta acotado por el repo auditado."
            echo "── .semgrepignore ──"; cat .semgrepignore
          else
            echo "sin .semgrepignore (se usan las exclusiones por defecto de semgrep)"
          fi
          TRACKED=$(git ls-files | wc -l | tr -d ' ')
          echo "archivos rastreados por git: $TRACKED"
          echo "  (si el numero escaneado por semgrep es mucho menor, el ignore esta comiendose el gate)"

      # La lógica NO se duplica aquí: se ejecuta `alcance.sh` del checkout del tooling, el
      # MISMO archivo que consume la composite action `.github/actions/alcance` para los
      # workflows locales de cada repo. Una implementación, dos modos de consumo — si viviera
      # inline, la copia de la receta y la de los repos divergirían en el primer arreglo.
      - name: "📐 Alcance del push (¿solo documentacion?)"
        id: alcance
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .watson-ci-tooling/.github/actions/alcance/alcance.sh

      # El checkout del tooling se borra ANTES de escanear: si no, semgrep analizaría el
      # código de la receta como si fuera del repo auditado.
      - name: Limpiar el checkout del tooling
        run: rm -rf .watson-ci-tooling

      - name: 🔑 Secrets scan (bloquea siempre)
        run: semgrep scan --config "p/secrets" --error --quiet --disable-version-check --metrics=off --timeout 120 .

      - name: 🛡️ SAST high/critical (diff-aware)
        if: steps.alcance.outputs.solo_docs != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          GATED_EXTRA: ${{ inputs.gated-branches }}
          GATED_STRICT: ${{ inputs.strict-on-gated }}
        run: |
          set -uo pipefail   # OJO: el shell de Actions ya trae -e; el advisory usa `if` para no abortar.
          CONFIGS='--config p/security-audit --config p/python'
          COMMON='--severity ERROR --quiet --disable-version-check --metrics=off --timeout 120'

          # --- branch-aware (v2.2): push/PR hacia rama GATEADA => full-estricto sin baseline.
          # "El costo donde el riesgo": la deuda vieja TAMBIEN bloquea camino a prod.
          TARGET_BRANCH="$BASE_REF"; [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="$REF_NAME"
          GATED=false
          set -f  # sin pathname-expansion: un archivo app_prod en el repo NO debe comerse el patrón *_prod (sec LOW 2026-07-18)
          for pat in main master *_prod $GATED_EXTRA; do
            # shellcheck disable=SC2254
            case "$TARGET_BRANCH" in $pat) GATED=true ;; esac
          done
          set +f
          if [ "$GATED" = true ] && [ "$GATED_STRICT" != "false" ]; then
            echo "rama gateada ($TARGET_BRANCH): SAST FULL-ESTRICTO (sin baseline — deuda tambien bloquea)."
            semgrep scan $CONFIGS $COMMON --error .
            exit 0
          fi
          [ "$GATED" = true ] && echo "rama gateada pero strict-on-gated=false (opt-out: security-tool/EOL) — sigue diff-aware."


          BASELINE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASELINE=$(git merge-base "$BASE_SHA" HEAD 2>/dev/null || true)
          elif [ "$EVENT_NAME" = "push" ]; then
            case "$BEFORE_SHA" in
              *[!0]*) git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null && BASELINE="$BEFORE_SHA" || true ;;
            esac
          fi

          if [ -n "$BASELINE" ]; then
            echo "diff-aware: bloqueando hallazgos ERROR NUEVOS vs $BASELINE"
            semgrep scan $CONFIGS $COMMON --baseline-commit "$BASELINE" --error .
          else
            echo "::warning::sin baseline (primer push / force-push / historia no relacionada) — full scan ADVISORY."
            if semgrep scan $CONFIGS $COMMON --error .; then rc=0; else rc=$?; fi
            if   [ "$rc" -eq 0 ]; then echo "✅ sin hallazgos ERROR."
            elif [ "$rc" -eq 1 ]; then echo "::warning::hallazgos ERROR (advisory: sin baseline no separamos nuevo de deuda)."
            else echo "::error::semgrep falló (rc=$rc) — fail-closed."; exit 1
            fi
          fi

      - name: 🟡 SAST medio/bajo (advisory)
        if: always() && steps.alcance.outputs.solo_docs != 'true'
        run: semgrep scan --config "p/security-audit" --config "p/python" --severity WARNING --quiet --disable-version-check --metrics=off --timeout 120 . || true

      # Dep-audit con pip-audit (PyPA oficial). Gate por JSON. --no-deps/--locked auditan SIN
      # instalar (no se ejecuta setup.py de ninguna dep). Solo fuentes TOTALMENTE PINEADAS.
      - name: 📦 pip-audit (bloquea CUALQUIER vuln SIEMPRE)
        env:
          AUDIT_OPTIONAL: ${{ inputs.python-audit-optional }}
          IGNORE_VULN: ${{ inputs.pip-audit-ignore-vuln }}
        run: |
          set -uo pipefail

          # maxdepth 6 (era 2, v3 2026-08-03): a profundidad 3+ NO se auditaba y el log decia
          # "pip-audit OK" igual. Caso real medido: makro_erpnext tiene
          # deploy/frappe_docker/requirements-test.txt (prof. 3) que NUNCA se audito, mientras
          # frappe_docker/requirements-test.txt (prof. 2) si. Verde con cobertura parcial es
          # peor que rojo: afirma algo falso.
          reqfiles=()
          while IFS= read -r f; do reqfiles+=("$f"); done < <(
            find . -maxdepth 6 -name 'requirements*.txt' \
              -not -path '*/.git/*' -not -path '*/node_modules/*' -not -path '*/.venv/*' \
              -not -path '*/venv/*' -not -path '*/site-packages/*' | sort)
          has_pylock=false; [ -f pylock.toml ] && has_pylock=true
          has_pyproject=false; [ -f pyproject.toml ] && has_pyproject=true

          # Lockfiles de otros gestores. NO se auditan (pip-audit no los lee), pero su
          # existencia significa "este proyecto SI tiene deps pineadas" — dar exit 0 aqui era
          # declarar cobertura total con cero cobertura.
          otros_locks=()
          for l in poetry.lock uv.lock Pipfile.lock pdm.lock; do
            [ -f "$l" ] && otros_locks+=("$l")
          done

          if [ "${#reqfiles[@]}" -eq 0 ] && [ "$has_pylock" = "false" ]; then
            if [ "${#otros_locks[@]}" -gt 0 ]; then
              echo "::error::Hay ${otros_locks[*]} pero pip-audit no lee ese formato: CERO cobertura de dependencias."
              echo "  Exporta a un formato auditable y commitealo:"
              echo "    poetry export -f requirements.txt --output requirements.txt"
              echo "    uv export --format requirements-txt > requirements.txt"
              echo "  O declara la excepcion con el input python-audit-optional: true."
              [ "${AUDIT_OPTIONAL:-false}" = "true" ] && { echo "::warning::exento por python-audit-optional"; exit 0; }
              exit 1
            fi
            if [ "$has_pyproject" = "true" ]; then
              echo "::error::Hay pyproject.toml pero ningun lockfile pineado (requirements*.txt / pylock.toml)."
              echo "  Auditar pyproject requeriria CONSTRUIR el proyecto — no se hace por seguridad."
              echo "  Genera un lockfile: 'pip lock' (PEP 751 -> pylock.toml) o pip-compile -> requirements.txt."
              echo "  Antes de v3 esto era exit 0 (VERDE sin auditar una sola dependencia)."
              [ "${AUDIT_OPTIONAL:-false}" = "true" ] && { echo "::warning::exento por python-audit-optional"; exit 0; }
              exit 1
            fi
            echo "sin manifiesto Python (requirements*.txt / pylock.toml / pyproject.toml) — skip pip-audit."
            exit 0
          fi

          # Excepciones DECLARADAS UNA A UNA. Se construyen como array para que un id vacio o
          # con espacios no se convierta en un argumento suelto que pip-audit malinterprete.
          IGNORE_ARGS=()
          if [ -n "${IGNORE_VULN:-}" ]; then
            IFS=',' read -ra _ids <<< "$IGNORE_VULN"
            for _id in "${_ids[@]}"; do
              _id="$(echo "$_id" | tr -d '[:space:]')"
              [ -n "$_id" ] && IGNORE_ARGS+=(--ignore-vuln "$_id")
            done
            echo "::warning::pip-audit con ${#IGNORE_ARGS[@]} excepcion(es) declarada(s): $IGNORE_VULN"
          fi

          # Fail-closed sobre UNA fuente. JSON inválido/ausente = tool falló => RED.
          audit_source() {
            local label="$1"; shift
            local out="/tmp/pipaudit_$$.json"
            echo "── auditando: $label"
            timeout 300 pip-audit "$@" "${IGNORE_ARGS[@]}" --format=json > "$out" 2>/tmp/pipaudit_err_$$.txt
            local rc=$?
            if ! jq -e . "$out" >/dev/null 2>&1; then
              echo "::error::pip-audit no produjo JSON válido para '$label' (rc=$rc) — tool/red falló o deps sin pinear."
              cat /tmp/pipaudit_err_$$.txt || true
              return 1
            fi
            local vulns
            vulns=$(jq '[.. | objects | select(has("vulns")) | .vulns[]?] | length' "$out")
            echo "vulns conocidas en '$label': $vulns"
            jq '[.. | objects | select(has("vulns")) | select((.vulns|length)>0) | {name, version, ids: [.vulns[].id]}]' "$out"
            if [ "$vulns" -gt 0 ]; then
              echo "::error::'$label' tiene $vulns vuln(s) — bloqueado (supply chain no es opcional; pip-audit no da severidad, ver #654)."
              return 1
            fi
            # `rc` != 0 con JSON valido y CERO vulns = la herramienta fallo de otra forma.
            # El orden importa: esta comprobacion va DESPUES de la de vulns, no antes. Al reves
            # (primer intento, 2026-08-03) el mensaje decia "aunque el JSON sea valido" para el
            # caso normal de "encontro vulnerabilidades", que es exactamente lo contrario de lo
            # que estaba pasando — un fail-closed correcto con un diagnostico enganoso.
            if [ "$rc" -ne 0 ]; then
              echo "::error::pip-audit salio con rc=$rc en '$label' con JSON valido y 0 vulns — fail-closed."
              cat /tmp/pipaudit_err_$$.txt || true
              return 1
            fi
            return 0
          }

          # --strict: enforce nativo de "totalmente pineadas" (una entrada URL/VCS/editable sin
          # pinear => error fatal, no skip silencioso => cierra el silent-coverage-gap).
          rc_total=0
          if [ "$has_pylock" = "true" ]; then
            audit_source "pylock.toml" --locked --strict || rc_total=1
          fi
          for f in "${reqfiles[@]}"; do
            audit_source "$f" --no-deps --strict -r "$f" || rc_total=1
          done

          if [ "$rc_total" -ne 0 ]; then
            echo "::error::pip-audit falló (ver arriba)."
            exit 1
          fi
          echo "✅ pip-audit OK."

      - name: 📋 Summary
        if: always()
        run: |
          echo "verify-python@v2 — secrets(siempre) + SAST(diff-aware) + pip-audit(siempre, cualquier vuln — sin severidad, #654)." >> "$GITHUB_STEP_SUMMARY"
