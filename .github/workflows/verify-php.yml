name: verify-php (reusable)

# Receta de verificación reutilizable para proyectos PHP/Laravel de la flota Watson.
# Solo la capa STACK-AGNÓSTICA de seguridad (secrets + SAST + dep audit) que NO necesita DB.
# Los tests con base de datos quedan en el workflow propio de cada proyecto.
#
# Uso desde un repo (v2 — BREAKING vs v1: sin input `blocking`):
#   on:
#     pull_request:            # el gate diff-aware vive aquí
#     push: { branches: [main] }
#   jobs:
#     verify:
#       uses: dwadrian/watson-ci/.github/workflows/verify-php.yml@v2
#       with:
#         php-version: '8.3'   # opcional
# NO pasar `secrets: inherit`: la receta no usa secretos y es superficie de ataque innecesaria.
#
# MODELO v2:
#   - secrets: SIEMPRE bloquea (una fuga vieja sigue siendo fuga; NO diff-aware).
#   - SAST ERROR: bloquea hallazgos NUEVOS vs baseline (merge-base en PR, before-SHA en push).
#     La deuda existente NO rompe; código nuevo con inyección/RCE SÍ. Sin baseline => advisory.
#   - deps: SIEMPRE bloquea high/critical (supply chain no es opcional, ni en tooling).

on:
  workflow_call:
    inputs:
      gated-branches:
        description: 'Patrones extra de ramas gateadas (espacio-separados, glob). Default siempre: main master *_prod'
        type: string
        default: ''
      strict-on-gated:
        description: 'false = NUNCA full-estricto en rama gateada (siempre diff-aware). Para security-tools cuyo código inseguro es by-design (mcp) o repos EOL. Default true.'
        type: boolean
        default: true
      php-version:
        description: 'Versión de PHP'
        type: string
        default: '8.3'

concurrency:
  group: verify-php-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # mínimo; la receta solo lee el código

jobs:
  verify:
    name: 🔒 secrets + SAST + deps (PHP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 => historia completa. Semgrep --baseline-commit necesita que el
      # commit baseline exista localmente para el diff. Con depth:1 no hay merge-base.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none   # grafo completo para merge-base; blobs on-demand (barato en repos grandes)

      - name: Setup Python (para Semgrep)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Instalar Semgrep (versión pineada)
        run: pip install semgrep==1.157.0

      # Secrets: full scan, SIEMPRE bloquea. NO baseline (un secreto commiteado hace meses
      # sigue exigiendo rotación; no es "deuda tolerable").
      - name: 🔑 Secrets scan (bloquea siempre)
        run: semgrep scan --config "p/secrets" --error --quiet --disable-version-check --timeout 120 .

      # SAST ERROR diff-aware. Corre ANTES de composer install => árbol limpio (semgrep
      # baseline aborta si hay cambios unstaged). Ruleset community pineado; NUNCA --config auto.
      - name: 🛡️ SAST high/critical (diff-aware)
        # SHAs por env (nunca interpolados en el shell) — evita el vector de script-injection.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          GATED_EXTRA: ${{ inputs.gated-branches }}
          GATED_STRICT: ${{ inputs.strict-on-gated }}
        run: |
          set -uo pipefail   # OJO: el shell de Actions ya trae -e; el advisory usa `if` para no abortar.
          CONFIGS='--config p/security-audit --config p/php'
          COMMON='--severity ERROR --quiet --disable-version-check --timeout 120'

          # --- branch-aware (v2.2): push/PR hacia rama GATEADA => full-estricto sin baseline.
          # "El costo donde el riesgo": la deuda vieja TAMBIEN bloquea camino a prod.
          TARGET_BRANCH="$BASE_REF"; [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="$REF_NAME"
          GATED=false
          set -f  # sin pathname-expansion: un archivo app_prod en el repo NO debe comerse el patrón *_prod (sec LOW 2026-07-18)
          for pat in main master *_prod $GATED_EXTRA; do
            # shellcheck disable=SC2254
            case "$TARGET_BRANCH" in $pat) GATED=true ;; esac
          done
          set +f
          if [ "$GATED" = true ] && [ "$GATED_STRICT" != "false" ]; then
            echo "rama gateada ($TARGET_BRANCH): SAST FULL-ESTRICTO (sin baseline — deuda tambien bloquea)."
            semgrep scan $CONFIGS $COMMON --error .
            exit 0
          fi
          [ "$GATED" = true ] && echo "rama gateada pero strict-on-gated=false (opt-out: security-tool/EOL) — sigue diff-aware."


          # --- resolver baseline (ramas feature: diff-aware como siempre) ---
          BASELINE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASELINE=$(git merge-base "$BASE_SHA" HEAD 2>/dev/null || true)
          elif [ "$EVENT_NAME" = "push" ]; then
            # sentinel de "sin padre" = 40 ceros; validar que el commit exista de verdad.
            case "$BEFORE_SHA" in
              *[!0]*) git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null && BASELINE="$BEFORE_SHA" || true ;;
            esac
          fi

          # --- correr ---
          if [ -n "$BASELINE" ]; then
            echo "diff-aware: bloqueando hallazgos ERROR NUEVOS vs $BASELINE"
            semgrep scan $CONFIGS $COMMON --baseline-commit "$BASELINE" --error .
          else
            echo "::warning::sin baseline (primer push / force-push / historia no relacionada) — full scan ADVISORY."
            # `if` desactiva -e en la condición => capturamos rc en vez de abortar.
            if semgrep scan $CONFIGS $COMMON --error .; then rc=0; else rc=$?; fi
            if   [ "$rc" -eq 0 ]; then echo "✅ sin hallazgos ERROR."
            elif [ "$rc" -eq 1 ]; then echo "::warning::hallazgos ERROR (advisory: sin baseline no separamos nuevo de deuda)."
            else echo "::error::semgrep falló (rc=$rc) — fail-closed."; exit 1
            fi
          fi

      - name: 🟡 SAST medio/bajo (advisory)
        if: always()
        run: semgrep scan --config "p/security-audit" --config "p/php" --severity WARNING --quiet --disable-version-check --timeout 120 . || true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:2
          coverage: none

      # Gate por EXIT-CODE + JSON, no por grep de tabla humana. JSON inválido => RED (fail-closed).
      # v2.0.1: audit --locked lee composer.lock directo, SIN composer install — más rápido,
      # cero lifecycle/plugins, y no truena con locks legacy incompatibles con el PHP del runner
      # (caso Laravel 4.2: install fallaba por plataforma antes de llegar al audit).
      # composer.json sin lock => RED (el lock es obligatorio para auditar lo que se despliega).
      - name: 📦 composer audit (bloquea high/critical SIEMPRE)
        run: |
          set -euo pipefail
          if [ ! -f composer.json ]; then echo "sin composer.json — skip composer audit"; exit 0; fi
          if [ ! -f composer.lock ]; then
            echo "::error::composer.json sin composer.lock — sin lock no hay audit reproducible (commitear el lock)."
            exit 1
          fi
          composer audit --locked --no-interaction --abandoned=ignore --format=json > /tmp/audit.json || true
          if ! jq -e . /tmp/audit.json >/dev/null 2>&1; then
            echo "::error::composer audit no produjo JSON válido (la herramienta falló) — bloqueando por seguridad."
            cat /tmp/audit.json || true
            exit 1
          fi
          TOTAL=$(jq '[.advisories[]?[]?] | length' /tmp/audit.json)
          HIGHCRIT=$(jq '[.advisories[]?[]? | select((.severity // "unknown") | ascii_downcase | test("high|critical"))] | length' /tmp/audit.json)
          UNKNOWN=$(jq '[.advisories[]?[]? | select((.severity // "unknown") == "unknown")] | length' /tmp/audit.json)
          echo "advisories: $TOTAL total · $HIGHCRIT high/critical · $UNKNOWN sin severidad"
          jq '.advisories' /tmp/audit.json
          if [ "$HIGHCRIT" -gt 0 ]; then
            echo "::error::Dependencias PHP high/critical: $HIGHCRIT — bloqueado (supply chain no es opcional)."
            exit 1
          fi
          echo "✅ composer audit OK (medium/low/sin-severidad no bloquean; revisar los $UNKNOWN sin severidad)."

      - name: 📋 Summary
        if: always()
        run: |
          echo "verify-php@v2 — secrets(siempre) + SAST(diff-aware) + composer audit(siempre high/crit)." >> "$GITHUB_STEP_SUMMARY"
