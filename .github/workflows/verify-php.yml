name: verify-php (reusable)

# Receta de verificación reutilizable para proyectos PHP/Laravel de la flota Watson.
# Solo la capa STACK-AGNÓSTICA de seguridad (secrets + SAST + dep audit) que NO necesita DB.
# Los tests con base de datos quedan en el workflow propio de cada proyecto.
#
# Uso desde un repo (v2 — BREAKING vs v1: sin input `blocking`):
#   on:
#     pull_request:            # el gate diff-aware vive aquí
#     push: { branches: [main] }
#   jobs:
#     verify:
#       uses: dwadrian/watson-ci/.github/workflows/verify-php.yml@v2
#       with:
#         php-version: '8.3'   # opcional
# NO pasar `secrets: inherit`: la receta no usa secretos y es superficie de ataque innecesaria.
#
# MODELO v2:
#   - secrets: SIEMPRE bloquea (una fuga vieja sigue siendo fuga; NO diff-aware).
#   - SAST ERROR: bloquea hallazgos NUEVOS vs baseline (merge-base en PR, before-SHA en push).
#     La deuda existente NO rompe; código nuevo con inyección/RCE SÍ. Sin baseline => advisory.
#   - deps: SIEMPRE bloquea high/critical (supply chain no es opcional, ni en tooling).

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          runs-on del job, en JSON (fabrica#2425). Runner propio: '["self-hosted","makro-web"]';
          lo normal es pasar la variable de repo vars.RUNS_ON. Default '"ubuntu-latest"' = el runner de
          siempre. Vacio cuenta como default: un `vars.RUNS_ON` sin definir llega como '' (el
          default de un input NO se aplica a un valor pasado vacio). Requisitos: README § Runner propio.
        type: string
        required: false
        default: '"ubuntu-latest"'
      gated-branches:
        description: 'Patrones extra de ramas gateadas (espacio-separados, glob). Default siempre: main master *_prod'
        type: string
        default: ''
      strict-on-gated:
        description: 'false = NUNCA full-estricto en rama gateada (siempre diff-aware). Para security-tools cuyo código inseguro es by-design (mcp) o repos EOL. Default true.'
        type: boolean
        default: true
      php-version:
        description: 'Versión de PHP'
        type: string
        default: '8.3'
      audit-allow-cve:
        description: 'CVEs concretos (coma-separados) exentos del bloqueo por advisory SIN severidad. NO hay escape global: cada falso positivo se declara por su id.'
        type: string
        default: ''
      tooling-ref:
        description: >-
          Ref de watson-ci de donde se toma el tooling pineado (requirements con hash y
          alcance.sh). Default 'v2'. NO se puede derivar en runtime: medido 2026-08-05 desde
          un repo externo, `github.job_workflow_ref` llega VACIO (es un claim de OIDC, no una
          expresion) y `github.workflow_ref` apunta al CALLER. Por eso es explicito. Un caller
          que consuma la receta por otro alias debe pasar el suyo.
        type: string
        default: 'v2'

concurrency:
  group: verify-php-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # mínimo; la receta solo lee el código

jobs:
  verify:
    name: 🔒 secrets + SAST + deps (PHP)
    # `|| '"ubuntu-latest"'`: ver la descripcion del input — sin el, `vars.RUNS_ON` vacio rompe el job.
    runs-on: ${{ fromJSON(inputs.runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      # ── Requisitos del runner (fabrica#2425) ─────────────────────────────────────────────
      # Un runner propio es una imagen mas minima que ubuntu-latest. Lo que se puede fijar con
      # version y checksum lo instala la receta (setup-python, jq); lo que NO (git, coreutils, y
      # para setup-php: curl + sudo sin contrasena) se comprueba AQUI, primero, y falla con la
      # lista de lo que falta. Sin git, actions/checkout cae a descargar por API SIN `.git`: el
      # merge-base sale vacio y el SAST degrada a ADVISORY en silencio. Sin sudo, setup-php se
      # queda esperando un candado que crea con `sudo mkdir` (medido en ci-makro 2026-09-26: 11+
      # min colgado hasta el timeout). POSIX sh a proposito: si falta bash, tiene que poder decirlo.
      - name: "🧰 Requisitos del runner"
        shell: sh
        run: |
          falta=""
          for t in bash git grep sed cat wc tr tar gzip uname curl; do
            command -v "$t" >/dev/null 2>&1 || falta="$falta $t"
          done
          # Siempre, no solo con RUNNER_ENVIRONMENT=self-hosted: setup-php se considera self-hosted
          # tambien sin ImageOS/ImageVersion o con CONTAINER/ACT (setup-php src/scripts/unix.sh:57).
          # En ubuntu-latest sudo sin contrasena viene de serie: ahi esto pasa siempre.
          if ! sudo -n true >/dev/null 2>&1; then
            falta="$falta sudo-sin-contrasena(setup-php)"
          fi
          if [ -n "$falta" ]; then
            echo "::error::Este runner no trae:$falta — ver README § Runner propio."
            exit 1
          fi
          # actions/checkout solo usa git (y deja `.git`) con git >= 2.18.
          v=$(git --version | sed -n 's/^git version \([0-9]*\)\.\([0-9]*\).*/\1 \2/p')
          # shellcheck disable=SC2086 # partir "2 43" en $1 $2 es lo que se busca
          set -- $v
          if [ -z "$v" ] || [ "$1" -lt 2 ] || { [ "$1" -eq 2 ] && [ "$2" -lt 18 ]; }; then
            echo "::error::git >= 2.18 requerido (hay: $(git --version)) — sin el, checkout baja sin historia."
            exit 1
          fi
          echo "runner OK: ${RUNNER_ENVIRONMENT:-?} $(uname -m) · $(git --version)"

      # fetch-depth: 0 => historia completa. Semgrep --baseline-commit necesita que el
      # commit baseline exista localmente para el diff. Con depth:1 no hay merge-base.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # persist-credentials: false — el GITHUB_TOKEN quedaba escrito en .git/config del
          # workspace, en el MISMO job donde corre el `pip install` de tooling cuyas deps
          # transitivas no estan pineadas por hash. Nada aqui usa el token para git: solo
          # merge-base, cat-file y --baseline-commit, todo local.
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none   # grafo completo para merge-base; blobs on-demand (barato en repos grandes)

      - name: Setup Python (para Semgrep)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # jq lo usa el gate de composer audit para DECIDIR (JSON valido, conteo high/critical y sin
      # severidad). ubuntu-latest lo trae de serie; un runner propio no tiene por que
      # (fabrica#2425). Se fija aqui: version + sha256 del release oficial (jqlang/jq,
      # sha256sum.txt), por arquitectura. 1.8.2 y no el 1.7.1 de ubuntu-24.04: el binario upstream
      # 1.7.1 NO lleva los arreglos de CVE-2024-23337, CVE-2024-53427 y CVE-2025-48060 (upstream
      # 1.8.0). selftest repite con ESTE pin las expresiones de decision de composer audit que
      # copia tests/expect-audit-decision.sh (UNKNOWN, HIGHCRIT, allowlist); el `jq -e .` no se
      # cubre aparte. Se descarga con el python de setup-python.
      - name: Instalar jq 1.8.2 (sha256 fijado)
        env:
          JQ_VERSION: jq-1.8.2
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)        arch=amd64; sha=b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f ;;
            aarch64|arm64) arch=arm64; sha=8b85c817833814ddca00a144c33705546355afccf0cf39b188f3cdb48b852309 ;;
            *) echo "::error::arquitectura $(uname -m) sin jq fijado — anadir su sha256 aqui."; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/watson-ci-bin"
          mkdir -p "$dir"
          python -I - "$JQ_VERSION" "$arch" "$sha" "$dir/jq" <<'PY'
          import hashlib, http.client, os, sys, time, urllib.error, urllib.request
          ver, arch, sha, dest = sys.argv[1:]
          url = f"https://github.com/jqlang/jq/releases/download/{ver}/jq-linux-{arch}"
          # 3 intentos SOLO ante fallo de red (incluido un corte a mitad: IncompleteRead es
          # HTTPException, no OSError). Un checksum que no coincide no se reintenta.
          for intento in (1, 2, 3):
              try:
                  data = urllib.request.urlopen(url, timeout=60).read()
                  break
              except (urllib.error.URLError, http.client.HTTPException, OSError) as e:
                  if intento == 3:
                      sys.exit(f"::error::no pude descargar {url}: {e}")
                  time.sleep(5 * intento)
          got = hashlib.sha256(data).hexdigest()
          if got != sha:
              sys.exit(f"::error::sha256 de {url} NO coincide: {got} != {sha}")
          # Atomico: temporal en el mismo directorio + os.replace. Nunca queda un jq a medias.
          tmp = f"{dest}.{os.getpid()}.tmp"
          with open(tmp, "wb") as f:
              f.write(data)
          os.chmod(tmp, 0o755)
          os.replace(tmp, dest)
          PY
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/jq" --version

      # ── El tooling pineado vive en watson-ci, NO en el repo que llama ────────────────
      # Un workflow reutilizable ejecuta sus `run:` sobre el checkout del CALLER, asi que
      # `tools/requirements-*.txt` solo resolvia dentro de watson-ci y reventaba en los 17
      # repos con "No such file or directory", matando el job antes de escanear NADA. El
      # canario `selftest.yml` es ciego a esta clase: corre DENTRO de watson-ci.
      #
      # La ref va como INPUT explicito, no derivada: medido desde un repo externo,
      # `github.job_workflow_ref` llega VACIO y `github.workflow_ref` apunta al caller.
      # No hay forma de que la receta sepa su propia ref.
      - name: Checkout del tooling de la receta
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: dwadrian/watson-ci
          ref: ${{ inputs.tooling-ref }}
          path: .watson-ci-tooling
          persist-credentials: false

      - name: Instalar Semgrep (versión pineada)
        # --require-hashes: TODAS las deps transitivas pineadas por hash (tools/requirements-semgrep.txt).
        # Antes solo el binario estaba pineado y sus ~30 deps se resolvian en cada corrida; una
        # sola comprometida ejecuta codigo en el job, con el fuente privado del caller ya en
        # disco. --no-deps porque el archivo ya trae el cierre transitivo completo.
        run: pip install --require-hashes --no-deps -r .watson-ci-tooling/tools/requirements-semgrep.txt

      # Secrets: full scan, SIEMPRE bloquea. NO baseline (un secreto commiteado hace meses
      # sigue exigiendo rotación; no es "deuda tolerable").
      # Visibilidad del alcance real del scan (v3, 2026-08-03).
      #
      # `semgrep scan .` honra el `.semgrepignore` del repo ESCANEADO. Eso es correcto por
      # diseño —un repo debe poder excluir vendor/ o dumps— pero significa que **el alcance del
      # gate lo controla el repo auditado**, y un PR puede ampliar ese archivo y quedar cubierto
      # por ese mismo PR. En la flota ya hay dos, ambos justificados, pero uno excluye `.claude/`
      # y `.githooks/`: justo donde vive código ejecutable.
      #
      # No se bloquea: prohibirlo rompería exclusiones legítimas. Se hace VISIBLE, que es lo que
      # faltaba — hoy nadie puede saber, leyendo un run verde, cuántos archivos se escanearon.
      - name: 👁️ Alcance del scan (.semgrepignore efectivo)
        run: |
          set -uo pipefail
          if [ -f .semgrepignore ]; then
            echo "::warning::Este repo tiene .semgrepignore — el alcance del gate esta acotado por el repo auditado."
            echo "── .semgrepignore ──"; cat .semgrepignore
          else
            echo "sin .semgrepignore (se usan las exclusiones por defecto de semgrep)"
          fi
          TRACKED=$(git ls-files | wc -l | tr -d ' ')
          echo "archivos rastreados por git: $TRACKED"
          echo "  (si el numero escaneado por semgrep es mucho menor, el ignore esta comiendose el gate)"

      # La lógica NO se duplica aquí: se ejecuta `alcance.sh` del checkout del tooling, el
      # MISMO archivo que consume la composite action `.github/actions/alcance` para los
      # workflows locales de cada repo. Una implementación, dos modos de consumo — si viviera
      # inline, la copia de la receta y la de los repos divergirían en el primer arreglo.
      - name: "📐 Alcance del push (¿solo documentacion?)"
        id: alcance
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .watson-ci-tooling/.github/actions/alcance/alcance.sh

      # El checkout del tooling se borra ANTES de escanear: si no, semgrep analizaría el
      # código de la receta como si fuera del repo auditado.
      - name: Limpiar el checkout del tooling
        run: rm -rf .watson-ci-tooling

      - name: 🔑 Secrets scan (bloquea siempre)
        run: semgrep scan --config "p/secrets" --error --quiet --disable-version-check --metrics=off --timeout 120 .

      # SAST ERROR diff-aware. Corre ANTES de composer install => árbol limpio (semgrep
      # baseline aborta si hay cambios unstaged). NUNCA --config auto.
        # OJO: los rulesets `p/...` NO estan pineados — se descargan MUTABLES de semgrep.dev
        # en cada corrida. Lo pineado es el BINARIO (semgrep==1.157.0). Este comentario decia
        # "Ruleset community pineado" y era FALSO; corregido en v3. El riesgo se acepto para
        # v1 con bus factor 1 y nunca se re-evaluo al pasar a 16 consumidores con produccion
        # incluida. Mitigacion pendiente (backlog): vendorizar las reglas en el repo.
      - name: 🛡️ SAST high/critical (diff-aware)
        if: steps.alcance.outputs.solo_docs != 'true'
        # SHAs por env (nunca interpolados en el shell) — evita el vector de script-injection.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          GATED_EXTRA: ${{ inputs.gated-branches }}
          GATED_STRICT: ${{ inputs.strict-on-gated }}
        run: |
          set -uo pipefail   # OJO: el shell de Actions ya trae -e; el advisory usa `if` para no abortar.
          CONFIGS='--config p/security-audit --config p/php'
          COMMON='--severity ERROR --quiet --disable-version-check --metrics=off --timeout 120'

          # --- branch-aware (v2.2): push/PR hacia rama GATEADA => full-estricto sin baseline.
          # "El costo donde el riesgo": la deuda vieja TAMBIEN bloquea camino a prod.
          TARGET_BRANCH="$BASE_REF"; [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="$REF_NAME"
          GATED=false
          set -f  # sin pathname-expansion: un archivo app_prod en el repo NO debe comerse el patrón *_prod (sec LOW 2026-07-18)
          for pat in main master *_prod $GATED_EXTRA; do
            # shellcheck disable=SC2254
            case "$TARGET_BRANCH" in $pat) GATED=true ;; esac
          done
          set +f
          if [ "$GATED" = true ] && [ "$GATED_STRICT" != "false" ]; then
            echo "rama gateada ($TARGET_BRANCH): SAST FULL-ESTRICTO (sin baseline — deuda tambien bloquea)."
            semgrep scan $CONFIGS $COMMON --error .
            exit 0
          fi
          [ "$GATED" = true ] && echo "rama gateada pero strict-on-gated=false (opt-out: security-tool/EOL) — sigue diff-aware."


          # --- resolver baseline (ramas feature: diff-aware como siempre) ---
          BASELINE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASELINE=$(git merge-base "$BASE_SHA" HEAD 2>/dev/null || true)
          elif [ "$EVENT_NAME" = "push" ]; then
            # sentinel de "sin padre" = 40 ceros; validar que el commit exista de verdad.
            case "$BEFORE_SHA" in
              *[!0]*) git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null && BASELINE="$BEFORE_SHA" || true ;;
            esac
          fi

          # --- correr ---
          if [ -n "$BASELINE" ]; then
            echo "diff-aware: bloqueando hallazgos ERROR NUEVOS vs $BASELINE"
            semgrep scan $CONFIGS $COMMON --baseline-commit "$BASELINE" --error .
          else
            echo "::warning::sin baseline (primer push / force-push / historia no relacionada) — full scan ADVISORY."
            # `if` desactiva -e en la condición => capturamos rc en vez de abortar.
            if semgrep scan $CONFIGS $COMMON --error .; then rc=0; else rc=$?; fi
            if   [ "$rc" -eq 0 ]; then echo "✅ sin hallazgos ERROR."
            elif [ "$rc" -eq 1 ]; then echo "::warning::hallazgos ERROR (advisory: sin baseline no separamos nuevo de deuda)."
            else echo "::error::semgrep falló (rc=$rc) — fail-closed."; exit 1
            fi
          fi

      - name: 🟡 SAST medio/bajo (advisory)
        if: always() && steps.alcance.outputs.solo_docs != 'true'
        run: semgrep scan --config "p/security-audit" --config "p/php" --severity WARNING --quiet --disable-version-check --metrics=off --timeout 120 . || true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:2
          coverage: none

      # Gate por EXIT-CODE + JSON, no por grep de tabla humana. JSON inválido => RED (fail-closed).
      # v2.0.1: audit --locked lee composer.lock directo, SIN composer install — más rápido,
      # cero lifecycle/plugins, y no truena con locks legacy incompatibles con el PHP del runner
      # (caso Laravel 4.2: install fallaba por plataforma antes de llegar al audit).
      # composer.json sin lock => RED (el lock es obligatorio para auditar lo que se despliega).
      - name: 📦 composer audit (bloquea high/critical SIEMPRE)
        # El input viaja por env, jamás interpolado en el bloque run — misma doctrina
        # anti-script-injection que los SHAs del paso de SAST.
        env:
          AUDIT_ALLOW_CVE: ${{ inputs.audit-allow-cve }}
        run: |
          set -euo pipefail
          if [ ! -f composer.json ]; then echo "sin composer.json — skip composer audit"; exit 0; fi
          if [ ! -f composer.lock ]; then
            echo "::error::composer.json sin composer.lock — sin lock no hay audit reproducible (commitear el lock)."
            exit 1
          fi
          composer audit --locked --no-interaction --abandoned=ignore --format=json > /tmp/audit.json || true
          if ! jq -e . /tmp/audit.json >/dev/null 2>&1; then
            echo "::error::composer audit no produjo JSON válido (la herramienta falló) — bloqueando por seguridad."
            cat /tmp/audit.json || true
            exit 1
          fi
          TOTAL=$(jq '[.advisories[]?[]?] | length' /tmp/audit.json)
          HIGHCRIT=$(jq '[.advisories[]?[]? | select((.severity // "unknown") | ascii_downcase | test("high|critical"))] | length' /tmp/audit.json)
          UNKNOWN=$(jq '[.advisories[]?[]? | select((.severity // "unknown") == "unknown")] | length' /tmp/audit.json)
          echo "advisories: $TOTAL total · $HIGHCRIT high/critical · $UNKNOWN sin severidad"
          jq '.advisories' /tmp/audit.json
          if [ "$HIGHCRIT" -gt 0 ]; then
            echo "::error::Dependencias PHP high/critical: $HIGHCRIT — bloqueado (supply chain no es opcional)."
            exit 1
          fi
          # Un advisory SIN campo `severity` tambien bloquea (v3, 2026-08-03). Antes solo se
          # avisaba: "medium/low/sin-severidad no bloquean". Los advisories de PHP via
          # FriendsOfPHP llegan con frecuencia sin metadato de severidad, asi que una RCE
          # critica en una dep de Laravel podia pasar en VERDE imprimiendo "composer audit OK".
          # Sin severidad != sin riesgo: es falta de dato, y ante falta de dato se bloquea.
          # Escape por CVE concreto (no global) via el input `audit-allow-cve`.
          if [ "$UNKNOWN" -gt 0 ]; then
            ALLOW="${AUDIT_ALLOW_CVE:-}"
            REMAIN=$(jq --arg allow "$ALLOW" '
              [.advisories[]?[]?
               | select((.severity // "unknown") == "unknown")
               | . as $a
               | select(($allow | split(",") | map(ascii_downcase | gsub("^\\s+|\\s+$";"")))
                        | index(($a.cve // $a.advisoryId // "sin-id") | ascii_downcase) | not)]
              | length' /tmp/audit.json)
            if [ "$REMAIN" -gt 0 ]; then
              echo "::error::$REMAIN advisory(s) SIN severidad y sin allowlist — bloqueado."
              echo "  Sin severidad no es sin riesgo: es falta de dato. Revisa el JSON de arriba."
              echo "  Si son falsos positivos, listalos por CVE en el input audit-allow-cve"
              echo "  (separados por coma). NO existe un escape global: cada uno se declara."
              exit 1
            fi
            echo "ℹ️ $UNKNOWN sin severidad, todos en la allowlist declarada."
          fi
          echo "✅ composer audit OK (medium/low no bloquean; sin-severidad SI bloquea salvo allowlist)."

      - name: 📋 Summary
        if: always()
        run: |
          echo "verify-php@v2 — secrets(siempre) + SAST(diff-aware) + composer audit(siempre high/crit)." >> "$GITHUB_STEP_SUMMARY"
