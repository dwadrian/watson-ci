name: selftest (canario de recetas)

# Corre las 3 recetas del COMMIT ACTUAL (referencia local `./`) sobre este mismo repo, mas los
# fixtures de decision.
#
# POR QUE CORRE EN push/PR Y NO SOLO A MANO (v3, 2026-08-03):
# hasta v2 esto era `workflow_dispatch:` unicamente. Consecuencia medida: `v2.2.0` (branch-aware
# full-strict) y `v2.2.1` cambiaron **que commits pasan y cuales fallan** en los repos gateados,
# se publicaron moviendo el alias `v2`, y el UNICO run de selftest de toda la historia era
# ANTERIOR a ambos. Encima, el corte de facturacion de GitHub tumbo el CI de la flota ~10 dias,
# asi que una regresion real no habria sido detectable. Que no pasara nada fue suerte.
#
# Este repo es el de mayor blast radius de la flota (16 consumidores, produccion incluida) y era
# el unico sin CI propio.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # cancel-in-progress: FALSE a proposito. Un canario que se cancela a si mismo no da senal:
  # ocurrio en el primer uso real (2026-08-03) -- el `git push origin main` disparo un run y el
  # `gh workflow run` manual, lanzado para verificar ANTES de mover el tag, cayo en el mismo
  # grupo y salio "cancelled". Ni verde ni rojo. Quien mira el resultado del dispatch para
  # decidir si publica, ve una cancelacion y no sabe nada.
  #
  # El costo de encolar dos runs de ~1 min es despreciable frente a publicar un tag creyendo
  # que el canario paso. Mismo criterio que el `concurrency` de los deploys: nunca cancelar
  # algo cuyo resultado alguien esta esperando para tomar una decision.
  group: selftest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Las recetas ARRANCAN de punta a punta (pines de actions, steps, skips limpios).
  node:
    uses: ./.github/workflows/verify-node.yml
  php:
    uses: ./.github/workflows/verify-php.yml
  python:
    uses: ./.github/workflows/verify-python.yml
    with:
      # Las 3 vulns de `mcp==1.23.3` en el cierre de semgrep. NO se pueden arreglar aqui:
      # semgrep lo pinea EXACTO, asi que forzar una version mas nueva rompe su contrato.
      # Se declaran UNA A UNA, no con un interruptor global, y se revisan en cada bump de
      # semgrep — si el pin sube, esta linea se borra.
      #
      # Ojo al alcance: esto aplica SOLO al selftest de watson-ci, que se audita a si mismo.
      # Ningun caller hereda estas excepciones; en un caller, tools/requirements-*.txt ni
      # siquiera existe (la receta hace checkout del repo llamador, no de este).
      pip-audit-ignore-vuln: 'PYSEC-2026-3481,PYSEC-2026-3482,PYSEC-2026-3483'

  # 2. Las recetas DECIDEN BIEN. Esto es lo que faltaba: "arranca" y "decide bien" son cosas
  #    distintas, y v2.2.0 cambio la segunda sin que nada lo verificara.
  decisiones:
    name: 🎯 fixtures de decision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Veredictos esperados sobre fixtures conocidos
        run: bash tests/expect-audit-decision.sh

      # Excepciones de dependencias que CADUCAN. Este script decide si un advisory bloquea
      # en los 17 repos, así que su suite corre ANTES de que se pueda publicar un tag.
      # Los fixtures son capturas REALES (npm de una app Expo, composer de un repo Laravel,
      # pip-audit 2.10.1): los tres hallazgos que más cambiaron el diseño no habrían
      # aparecido con datos inventados.
      - name: Excepciones de auditoría — decisión sobre corpus real
        run: bash tests/audit-exceptions.test.sh

      # Un tag no puede prometer lo que no contiene. Prometido el 2026-08-07 tras el primer
      # reporte, se quedó en el backlog, y el 2026-08-11 volvió a morder con `v3` — que no
      # perdió un archivo sino el DIRECTORIO entero de acciones.
      # Bloquea sobre el ref que se publicaría; los tags ya rotos se listan sin bloquear
      # (arreglarlos exige mover tags inmutables y eso es decisión del dueño, no de un test).
      - name: Un tag contiene las acciones que promete
        run: bash tests/tag-completo.test.sh

      # Un `.sh` bajo `docs/` NO es documentacion: es codigo que se distribuye a 22 repos. El
      # `case` decia `docs/*|*.md` y en POSIX el `*` CRUZA LA BARRA, asi que un push que solo
      # tocara `docs/scripts/deploy.sh` pasaba SIN SAST. Reportado 2026-08-18, 14 dias sin atender.
      # El test extrae el `case` REAL del script en vez de reimplementarlo: una copia mide su
      # propia copia, no el fichero que corre en CI.
      - name: Un `.sh` no es documentacion por vivir en docs/
        run: bash tests/alcance-clasificacion.test.sh
